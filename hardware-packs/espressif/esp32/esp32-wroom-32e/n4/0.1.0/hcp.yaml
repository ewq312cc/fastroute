    device: DEV-ESP32-WROOM-32E-N4
  params:
    pins:
    - '17'
    - '18'
    - '19'
    - '20'
    - '21'
    - '22'
    - '32'
    reason: GPIO6 to GPIO11 of the chip are connected to the SPI flash inside the module and are not led out
  evidence:
  - source_id: SRC-ESP32-WROOM32E-DS
    locator:
      page: 11
      table: 'Table 3: Pin Definitions'
    quote: NC 17 - See note 2
    basis: explicit
  - source_id: SRC-ESP32-WROOM32E-DS
    locator:
      page: 12
      table: 'Table 3: Pin Definitions'
    quote: Pins GPIO6 to GPIO11 on the ESP32-D0WD-V3/ESP32-D0WDR2-V3 chip are connected to the SPI flash integrated on the module and
