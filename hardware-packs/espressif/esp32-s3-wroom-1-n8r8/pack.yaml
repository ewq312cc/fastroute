  missing: 'Figure 9-1 of the module datasheet v1.8 (page 41) shows R1 and C2 of the EN circuit as "TBD". The text of the same page and the Hardware Design Guidelines say "usually R = 10 kΩ and C = 1 µF" and tell the designer to adjust the values to the power-up timing of the module and the chip (rule C-ESP-NEED-RESET keeps the usual values as a recommendation). The final values depend on the supply ramp of the project, which no document gives: the project has to decide them and test the power-up.'
