rules:
- id: C-ESP-ANT-KEEPOUT
  kind: keepout
  modifiability: required
  title: 模组 PCB 天线的禁布区：此区域内不得有走线、过孔、元件和铜皮
  subject:
    region: REG-ESP-ANT
  params:
    forbid:
    - track
    - via
    - component
    - zone
  evidence:
  - source_id: SRC-ESP32S3-WROOM1-DS
    locator:
      page: 10
      figure: Figure 3-1. Pin Layout (Top View)
    quote: To learn more about the keepout zone for module’s antenna on the base board, please refer to ESP32-S3 Hardware Design Guidelines > Section General Principles of PCB Layout for Modules.
    basis: explicit
  - source_id: SRC-ESP32S3-HDG-PCB
    locator:
      section: General Principles of PCB Layout for Modules
    quote: Then cut off the base board on both sides of the antenna and below it to minimize the impact of the base board material on the PCB antenna and provide a sufficiently large clearance area for the PCB antenna.
    basis: explicit
