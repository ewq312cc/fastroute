- id: C-DK-RSVD-PSRAM
  kind: reserved_pin
  modifiability: fixed
  title: GPIO35, GPIO36 and GPIO37 (J3.13, J3.12, J3.11) are used for the Octal SPI flash/PSRAM of the module and are not available
