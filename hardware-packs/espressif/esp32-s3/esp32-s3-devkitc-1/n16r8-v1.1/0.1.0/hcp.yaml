  evidence:
  - source_id: SRC-DK-UG
    locator:
      section: Getting Started, Description of Components
    quote: For boards with Octal SPI flash/PSRAM memory embedded ESP32-S3-WROOM-1/1U modules, and boards with ESP32-S3-WROOM-2 modules,
      the pins GPIO35, GPIO36 and GPIO37 are used for the internal communication between ESP32-S3 and SPI flash/PSRAM memory, thus not
      available for external use.
    basis: explicit
  - source_id: SRC-DK-UG
    locator:
      section: Contents and Packaging, Ordering Information
    quote: ESP32-S3-DevKitC-1-N16R8 ESP32-S3-WROOM-1 16 MB 8 MB PCB on-board antenna
    basis: explicit
- id: C-DK-ANT-CLEARANCE
  kind: keepout
  modifiability: unknown
  title: The RF clearance a carrier must keep around the board's PCB antenna
  subject:
    region: REG-DK-ANT
  params:
    forbid:
    - track
    - via
    - component
    - zone
  missing: The DXF gives the antenna part of the module (18 x 6.3 mm, beyond the board's top edge) and that is the only zone this pack
    forbids. The user guide of the board says nothing about the clearance a carrier must keep beside or under it; the module's guideline
    (cut the base board away on both sides of the antenna and below it) is written for a module soldered to a base board, not for a
    board plugged into a carrier, and this pack does not apply it by guess. A person has to decide.
