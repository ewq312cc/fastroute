    locator:
      section: USB
    quote: Use differential pairs and route them in parallel at equal lengths. Maintain a differential pair impedance of 90 Ω with a tolerance of ±10%.
    basis: explicit
  - source_id: SRC-ESP32S3-HDG-SCH
    locator:
      section: USB
    quote: GPIO19 and GPIO20 can be used as D- and D+ of USB respectively.
    basis: explicit
- id: C-ESP-USB-GAP
  kind: high_speed
  modifiability: unknown
  title: USB 差分对的线间距
  params:
    nets:
    - USB_DP
    - USB_DM
    - USB_D+
    - USB_D-
    differential: true
    gap_mm: null
  missing: The gap between the two traces depends on the stack-up and the trace width; the documents read give the 90 Ω target but no spacing. The stack-up of the board is needed (the plugin's impedance tool can derive widths from it).
