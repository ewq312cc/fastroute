[package]
name = "fastroute"
description = "Command-line PCB autorouter (Rust port of Freerouting)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fr-dsn = { path = "../fr-dsn" }
fr-settings = { path = "../fr-settings" }
fr-io = { path = "../fr-io" }
fr-engine = { path = "../fr-engine" }
fr-geom = { path = "../fr-geom" }
fr-render = { path = "../fr-render" }
fr-constraint = { path = "../fr-constraint" }
log = "0.4"
mimalloc = { version = "0.1", default-features = false }
ctrlc = { version = "3.4.5", features = ["termination"] }
dhat = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# heap profiling (writes dhat-heap.json; view with https://nnethercote.github.io/dh_view/dh_view.html)
dhat-heap = ["dep:dhat"]


[dev-dependencies]
png = "0.17"
